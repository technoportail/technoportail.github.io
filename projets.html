
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="img/technoportail3.ico">
    <title>Projets — Technoportail</title>

    <!-- W3.CSS -->
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="navigation.css">
    <link rel="stylesheet" href="projets.css">
</head>

<body class="projets-page" style="--cover-image:url('img/headers/circuit_jpg.jpg'); --accent-rgb:76,175,80;">

    <!-- TOPBAR DESKTOP -->
    <header class="tp-topbar w3-hide-small">
        <nav class="tp-topbar-inner" aria-label="Navigation principale">
            <a href="index.html" class="tp-brand">
                <img src="img/technoportail3.ico" alt="">
                <span>Technoportail</span>
            </a>

            <div class="tp-topbar-links">
                <a href="classeurs.html">
                    <i class="fas fa-book-atlas"></i> Classeur
                </a>
                <a href="activites.html">
                    <i class="fas fa-desktop"></i> Activités
                </a>
                <a href="projets.html" class="active" aria-current="page">
                    <i class="fas fa-shapes"></i> Projets
                </a>
            </div>
        </nav>
    </header>

    <main class="projets-content">

        <!-- INTRODUCTION -->
        <header class="projets-header w3-center">
            <h1>Les réalisations des élèves</h1>
            <p>Découvrez les créations imaginées et réalisées en technologie.</p>
        </header>

        <!-- FILTRES -->
        <nav class="projets-filters" id="projetsFilters" aria-label="Catégories de projets"></nav>

        <!-- COMPTEUR -->
        <div class="projets-heading">
            <h2 id="projetsCategoryTitle">Toutes les réalisations</h2>
            <span id="projetsCount"></span>
        </div>

        <!-- GALERIE -->
        <section class="projets-grid" id="projetsGrid" aria-label="Galerie des réalisations"></section>

        <p class="projets-empty" id="projetsEmpty" hidden>
            Aucune réalisation dans cette catégorie pour le moment.
        </p>

    </main>

    <!-- MODAL PHOTO -->
    <div class="projets-modal" id="projetsModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
        <div class="projets-modal-backdrop" data-close="true"></div>

        <div class="projets-modal-dialog">
            <button class="projets-modal-close" id="modalClose" type="button" aria-label="Fermer">
                <i class="fas fa-xmark"></i>
            </button>

            <div class="projets-modal-image-wrap">
                <img id="modalImage" alt="">
            </div>

            <div class="projets-modal-content">
                <span class="projets-modal-category" id="modalCategory"></span>
                <h2 id="modalTitle"></h2>
                <p id="modalDescription"></p>

                <div class="projets-modal-author">
                    <i class="fas fa-user-group"></i>
                    <span id="modalAuthor"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- BOTTOM NAV MOBILE -->
    <nav class="home-bottom-nav w3-bar w3-white w3-bottom w3-hide-medium w3-hide-large" aria-label="Navigation mobile">
        <a href="index.html" class="w3-bar-item w3-button w3-center home-nav-item">
            <i class="fas fa-home"></i><span>Accueil</span>
        </a>
        <a href="classeurs.html" class="w3-bar-item w3-button w3-center home-nav-item">
            <i class="fas fa-book-atlas"></i><span>Classeur</span>
        </a>
        <a href="activites.html" class="w3-bar-item w3-button w3-center home-nav-item">
            <i class="fas fa-desktop"></i><span>Activités</span>
        </a>
        <a href="projets.html" class="w3-bar-item w3-button w3-center home-nav-item home-nav-active" aria-current="page">
            <i class="fas fa-shapes"></i><span>Projets</span>
        </a>
    </nav>

    <script src="js/projets.js"></script>
    <script src="js/projets-layout.js"></script>
</body>
</html>
